<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c77c3"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="299" rx="16" fill="#ffffff" stroke="#d0d7de"/>

  <text x="480" y="40" text-anchor="middle" fill="#0a328f" font-size="18" font-weight="600">From a selfie to a live-or-spoof score</text>

  <!-- Box 1: selfie -->
  <rect x="40" y="90" width="170" height="100" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="125" y="130" text-anchor="middle" fill="#0a328f" font-size="16">Selfie</text>
  <text x="125" y="152" text-anchor="middle" fill="#0a328f" font-size="16">from the camera</text>
  <text x="125" y="220" text-anchor="middle" fill="#57606a" font-size="13">one photo, any size</text>

  <!-- Arrow 1 -->
  <line x1="212" y1="140" x2="258" y2="140" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: face crop -->
  <rect x="260" y="90" width="170" height="100" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="345" y="130" text-anchor="middle" fill="#0a328f" font-size="16">Face crop</text>
  <text x="345" y="152" text-anchor="middle" fill="#0a328f" font-size="16">224 x 224, RGB</text>
  <text x="345" y="220" text-anchor="middle" fill="#57606a" font-size="13">cropped by your app, scaled to 0..1</text>

  <!-- Arrow 2 -->
  <line x1="432" y1="140" x2="478" y2="140" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: MobileNetV2 -->
  <rect x="480" y="90" width="190" height="100" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="575" y="130" text-anchor="middle" fill="#0a328f" font-size="16">MobileNetV2</text>
  <text x="575" y="152" text-anchor="middle" fill="#0a328f" font-size="16">+ small classifier head</text>
  <text x="575" y="220" text-anchor="middle" fill="#57606a" font-size="13">trained on real and spoof photos</text>

  <!-- Arrow 3 -->
  <line x1="672" y1="140" x2="718" y2="140" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: score -->
  <rect x="720" y="90" width="200" height="100" rx="10" fill="#eaf4ff" stroke="#5cc8ff" stroke-width="2"/>
  <text x="820" y="124" text-anchor="middle" fill="#0a328f" font-size="16">One number, 0 to 1</text>
  <text x="820" y="146" text-anchor="middle" fill="#0a328f" font-size="16">"how likely a spoof"</text>
  <text x="820" y="170" text-anchor="middle" fill="#57606a" font-size="13">below threshold = live</text>
  <text x="820" y="220" text-anchor="middle" fill="#57606a" font-size="13">above threshold = spoof, rejected</text>

  <text x="480" y="270" text-anchor="middle" fill="#57606a" font-size="13">The model is exported to TensorFlow Lite so the same steps run on a phone.</text>
</svg>
