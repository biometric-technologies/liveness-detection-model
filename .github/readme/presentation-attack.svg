<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c77c3"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="329" rx="16" fill="#ffffff" stroke="#d0d7de"/>

  <text x="480" y="40" text-anchor="middle" fill="#0a328f" font-size="18" font-weight="600">How a presentation attack is detected</text>

  <!-- Left column: three kinds of presentation -->
  <rect x="40" y="70" width="200" height="60" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="140" y="96" text-anchor="middle" fill="#0a328f" font-size="16">Live person</text>
  <text x="140" y="118" text-anchor="middle" fill="#57606a" font-size="13">skin, depth, natural light</text>

  <rect x="40" y="150" width="200" height="60" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="140" y="176" text-anchor="middle" fill="#0a328f" font-size="16">Printed photo</text>
  <text x="140" y="198" text-anchor="middle" fill="#57606a" font-size="13">paper grain, print dots, flat</text>

  <rect x="40" y="230" width="200" height="60" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="140" y="256" text-anchor="middle" fill="#0a328f" font-size="16">Screen replay</text>
  <text x="140" y="278" text-anchor="middle" fill="#57606a" font-size="13">pixel grid, glare, screen edge</text>

  <!-- Arrows into the network -->
  <line x1="242" y1="100" x2="378" y2="165" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="242" y1="180" x2="378" y2="180" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="242" y1="260" x2="378" y2="195" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="168" text-anchor="middle" fill="#57606a" font-size="13">same camera</text>

  <!-- Network box -->
  <rect x="380" y="120" width="220" height="120" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="490" y="158" text-anchor="middle" fill="#0a328f" font-size="16">The network has seen</text>
  <text x="490" y="180" text-anchor="middle" fill="#0a328f" font-size="16">thousands of labeled</text>
  <text x="490" y="202" text-anchor="middle" fill="#0a328f" font-size="16">real and spoof photos</text>
  <text x="490" y="224" text-anchor="middle" fill="#57606a" font-size="13">and learned which traces matter</text>

  <!-- Arrow to decision -->
  <line x1="602" y1="180" x2="698" y2="180" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="168" text-anchor="middle" fill="#57606a" font-size="13">spoof score</text>

  <!-- Decision boxes -->
  <rect x="700" y="100" width="220" height="60" rx="10" fill="#eaf4ff" stroke="#5cc8ff" stroke-width="2"/>
  <text x="810" y="126" text-anchor="middle" fill="#0a328f" font-size="16">Score below threshold</text>
  <text x="810" y="148" text-anchor="middle" fill="#57606a" font-size="13">live: continue to face matching</text>

  <rect x="700" y="200" width="220" height="60" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="810" y="226" text-anchor="middle" fill="#0a328f" font-size="16">Score above threshold</text>
  <text x="810" y="248" text-anchor="middle" fill="#57606a" font-size="13">attack: reject, ask to retry</text>

  <text x="480" y="312" text-anchor="middle" fill="#57606a" font-size="13">One image, one score. You choose the threshold: lower rejects more attacks and more real users, higher the opposite.</text>
</svg>
